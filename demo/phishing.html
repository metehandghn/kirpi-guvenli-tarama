<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>e-Devlet Kapısı — Giriş</title>
<style>body{font-family:sans-serif;max-width:360px;margin:60px auto;text-align:center}
input{display:block;width:100%;padding:10px;margin:8px 0;box-sizing:border-box}</style>
</head>
<body>
  <!-- TEST: "e-devlet" markası + TC/şifre alanı + resmi olmayan domain = oltalama -->
  <h2>e-Devlet Kapısı</h2>
  <p>Devam etmek için giriş yapın (bu bir TEST sayfasıdır)</p>
  <form onsubmit="return false">
    <input type="text" name="tckn" placeholder="T.C. Kimlik No" maxlength="11" inputmode="numeric">
    <input type="password" name="sifre" placeholder="e-Devlet Şifresi">
    <button>Giriş Yap</button>
  </form>
  <p style="color:#888;font-size:13px">Eklenti çalışıyorsa bu sayfayı görmeden uyarı ekranına yönlenirsin.</p>
</body>
</html>
